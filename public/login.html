<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Banhcuon Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#8068ec;
  --purple-dark:#6b55d9;
  --bg:#1a1b1e;
  --card:#2b2d31;
  --text:#fff;
  --muted:#b5bac1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  margin:0;
  font-family:'Poppins',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* Animated background */
.bg-shapes{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:0;
}
.shape{
  position:absolute;
  border-radius:50%;
  background:linear-gradient(135deg,#8068ec55,#6b55d955);
  animation:float 20s infinite ease-in-out;
}
.shape:nth-child(1){width:300px;height:300px;top:-150px;left:-150px;animation-delay:0s}
.shape:nth-child(2){width:400px;height:400px;bottom:-200px;right:-200px;animation-delay:-5s}
.shape:nth-child(3){width:250px;height:250px;top:30%;right:10%;animation-delay:-10s}
.shape:nth-child(4){width:200px;height:200px;bottom:20%;left:15%;animation-delay:-15s}

@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(30px,-30px) scale(1.1)}
  50%{transform:translate(-20px,20px) scale(0.9)}
  75%{transform:translate(25px,15px) scale(1.05)}
}

/* Login container */
.container{
  position:relative;
  z-index:1;
  width:min(90%,420px);
  animation:fadeIn 0.6s ease-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.card{
  background:var(--card);
  border-radius:24px;
  padding:48px 40px;
  box-shadow:0 20px 60px #0008;
  border:1px solid #3a3c43;
  text-align:center;
}

/* Logo */
.logo{
  width:80px;
  height:80px;
  margin:0 auto 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));
  border-radius:20px;
  box-shadow:0 8px 24px #8068ec44;
  animation:pulse 3s infinite;
}
.logo svg{
  width:48px;
  height:36px;
}

@keyframes pulse{
  0%,100%{transform:scale(1);box-shadow:0 8px 24px #8068ec44}
  50%{transform:scale(1.05);box-shadow:0 12px 32px #8068ec66}
}

h1{
  font-size:28px;
  font-weight:700;
  margin:0 0 8px;
  letter-spacing:-0.5px;
}

.subtitle{
  color:var(--muted);
  font-size:15px;
  margin:0 0 32px;
  line-height:1.5;
}

/* Discord button */
.discord-btn{
  width:100%;
  background:#5865f2;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:16px 24px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  transition:all 0.2s;
  position:relative;
  overflow:hidden;
}
.discord-btn:hover{
  background:#4752c4;
  transform:translateY(-2px);
  box-shadow:0 8px 24px #5865f244;
}
.discord-btn:active{
  transform:translateY(0);
}
.discord-btn:disabled{
  background:#3a3c43;
  color:#6e7078;
  cursor:not-allowed;
  transform:none;
}

/* Loading spinner */
.spinner{
  width:20px;
  height:20px;
  border:3px solid #ffffff33;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}

/* Discord icon */
.discord-icon{
  width:24px;
  height:24px;
}

/* Security note */
.security{
  margin-top:24px;
  padding-top:24px;
  border-top:1px solid #3a3c43;
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}
.security svg{
  width:16px;
  height:16px;
  vertical-align:middle;
  margin-right:6px;
  opacity:0.7;
}

/* Features */
.features{
  margin-top:32px;
  display:grid;
  gap:12px;
  text-align:left;
}
.feature{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:14px;
  color:var(--muted);
}
.feature-icon{
  width:32px;
  height:32px;
  background:#8068ec22;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

@media(max-width:480px){
  .card{padding:36px 28px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="container">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 60 44"><rect x="6" y="10" width="48" height="16" rx="8" fill="#f8efd6" stroke="#dcc99a" stroke-width="2"/><rect x="10" y="26" width="48" height="14" rx="7" fill="#f4e9cc" stroke="#dcc99a" stroke-width="2"/><circle cx="14" cy="18" r="5" fill="#9a6b4b"/></svg>
    </div>
    
    <h1>Chào mừng đến Banhcuon Bot</h1>
    <p class="subtitle">Đăng nhập với Discord để truy cập dashboard và quản lý bot của bạn</p>
    
    <button class="discord-btn" id="loginBtn">
      <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      <span id="btnText">Đăng nhập với Discord</span>
    </button>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🎯</div>
        <span>Quản lý quest và coins</span>
      </div>
      <div class="feature">
        <div class="feature-icon">🛒</div>
        <span>Mua roles và items độc quyền</span>
      </div>
      <div class="feature">
        <div class="feature-icon">📊</div>
        <span>Xem thống kê và leaderboard</span>
      </div>
    </div>
    
    <div class="security">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      Chúng tôi chỉ yêu cầu quyền đọc thông tin cơ bản. Không yêu cầu quyền gửi tin nhắn hoặc truy cập nội dung chat.
    </div>
  </div>
</div>

<script>
const btn = document.getElementById('loginBtn');
const btnText = document.getElementById('btnText');

btn.addEventListener('click', async () => {
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';
  
  try {
    // Get Discord OAuth URL from backend
    const response = await fetch('/api/auth/discord/url');
    const data = await response.json();
    
    if (data.url) {
      // Redirect to Discord OAuth
      window.location.href = data.url;
    } else {
      throw new Error('Failed to get OAuth URL');
    }
  } catch (error) {
    console.error('Login error:', error);
    btnText.textContent = 'Lỗi! Thử lại';
    btn.disabled = false;
    
    setTimeout(() => {
      btnText.textContent = 'Đăng nhập với Discord';
    }, 2000);
  }
});

// Check if already logged in
const token = localStorage.getItem('auth_token');
if (token) {
  // Verify token
  fetch('/api/auth/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      // Already logged in, redirect to dashboard
      window.location.href = '/index.html';
    }
  })
  .catch(() => {
    // Token invalid, clear it
    localStorage.removeItem('auth_token');
  });
}
</script>
</body>
</html>
