<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop - Bánh Cuốn Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--surface:#111827;--surface-2:#1f2937;--border:#374151;--text:#f9fafb;--text-2:#e5e7eb;--text-3:#9ca3af;--primary:#8b5cf6;--primary-hover:#7c3aed;--primary-light:rgba(139,92,246,0.1);--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--gold:#fbbf24;--shadow:0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.logo-area{padding:24px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),#a78bfa);border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 0 20px rgba(139,92,246,0.4);animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(139,92,246,0.4)}50%{transform:scale(1.05);box-shadow:0 0 30px rgba(139,92,246,0.6)}}
.logo-text{font-size:18px;font-weight:800;letter-spacing:-0.5px}
.nav{padding:16px 12px}
.nav-section{margin-bottom:24px}
.nav-label{padding:0 12px 8px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-3);letter-spacing:0.5px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:10px;color:var(--text-3);cursor:pointer;transition:all 0.2s;font-size:14px;font-weight:600;position:relative;text-decoration:none}
.nav-item:hover{background:var(--surface-2);color:var(--text-2)}
.nav-item.active{background:var(--primary-light);color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.nav-icon{width:20px;height:20px;opacity:0.8}
.nav-item.active .nav-icon{opacity:1}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--primary);border-radius:0 10px 10px 0}
.main{flex:1;margin-left:280px;background:var(--bg)}
.topbar{height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;gap:20px;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);background:rgba(17,24,39,0.8)}
.search-box{flex:1;max-width:500px;position:relative}
.search-box input{width:100%;height:44px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:0 16px 0 44px;color:var(--text);font-size:14px;font-family:inherit;transition:all 0.2s}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;opacity:0.5;transition:all 0.3s}
.search-box input:focus ~ .search-icon{opacity:1;transform:translateY(-50%) scale(1.1)}
.topbar-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;transition:all 0.2s;position:relative}
.icon-btn:hover{background:var(--surface);border-color:var(--primary)}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--surface);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:0.7}}
.user-btn{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.2s}
.user-btn:hover{background:var(--surface);border-color:var(--primary)}
.user-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#a78bfa);object-fit:cover}
.user-name{font-size:14px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balance-badge{display:flex;align-items:center;gap:8px;padding:8px 16px;background:linear-gradient(135deg,var(--gold),#f59e0b);border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 0 20px rgba(251,191,36,0.2);transition:all 0.3s;animation:coinPulse 2s ease-in-out infinite}
.balance-badge:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(251,191,36,0.4)}
@keyframes coinPulse{0%,100%{box-shadow:0 0 20px rgba(251,191,36,0.2)}50%{box-shadow:0 0 30px rgba(251,191,36,0.4),0 0 40px rgba(251,191,36,0.2)}}
.content{padding:32px}
.page-header{margin-bottom:32px}
.page-title{font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:8px;background:linear-gradient(135deg,var(--text),var(--text-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleSlide 1s ease-out}
@keyframes titleSlide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.page-subtitle{font-size:16px;color:var(--text-3);animation:subtitleFade 1s ease-out 0.2s both}
@keyframes subtitleFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.filter-tabs{display:flex;gap:12px;margin-bottom:32px;padding:6px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
.filter-tab{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;transition:all 0.3s;border:none;background:transparent;position:relative}
.filter-tab::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:2px;background:var(--primary);transform:translateX(-50%);transition:width 0.3s}
.filter-tab:hover{color:var(--text-2);transform:translateY(-2px)}
.filter-tab:hover::after{width:80%}
.filter-tab.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(139,92,246,0.3);transform:translateY(-2px)}
.filter-tab.active::after{width:0}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.shop-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;transition:all 0.3s;position:relative;overflow:hidden}
.shop-item::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),#a78bfa);transform:scaleX(0);transform-origin:left;transition:transform 0.3s}
.shop-item:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:var(--shadow)}
.shop-item:hover::before{transform:scaleX(1)}
.shop-item.premium::before{background:linear-gradient(90deg,var(--gold),#f59e0b)}
.shop-item.premium:hover{border-color:var(--gold);animation:premiumGlow 1.5s ease-in-out infinite}
@keyframes premiumGlow{0%,100%{box-shadow:0 20px 25px -5px rgba(0,0,0,0.3),0 0 0 0 rgba(251,191,36,0.3)}50%{box-shadow:0 20px 35px -5px rgba(0,0,0,0.4),0 0 30px 5px rgba(251,191,36,0.5)}}
.item-icon{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#a78bfa);display:grid;place-items:center;font-size:36px;margin-bottom:20px;box-shadow:0 8px 16px rgba(139,92,246,0.2);transition:all 0.3s}
.shop-item:hover .item-icon{transform:scale(1.1) rotate(5deg);box-shadow:0 12px 24px rgba(139,92,246,0.4)}
.shop-item.premium .item-icon{background:linear-gradient(135deg,var(--gold),#f59e0b);animation:iconGlow 3s ease-in-out infinite}
.shop-item.premium:hover .item-icon{animation:iconSpin 0.6s ease-out}
@keyframes iconGlow{0%,100%{box-shadow:0 8px 16px rgba(251,191,36,0.2)}50%{box-shadow:0 8px 24px rgba(251,191,36,0.4),0 0 30px rgba(251,191,36,0.3)}}
@keyframes iconSpin{0%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.15) rotate(180deg)}100%{transform:scale(1.1) rotate(360deg)}}
.item-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.item-name{font-size:18px;font-weight:700}
.item-badge{padding:4px 10px;background:var(--primary-light);color:var(--primary);border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase}
.shop-item.premium .item-badge{background:rgba(251,191,36,0.1);color:var(--gold)}
.item-desc{font-size:14px;color:var(--text-3);line-height:1.6;margin-bottom:20px}
.item-footer{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--border)}
.item-price{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;animation:priceShine 3s ease-in-out infinite}
.item-price .coin{font-size:18px;opacity:0.7;animation:coinFloat 2s ease-in-out infinite}
@keyframes priceShine{0%,100%{opacity:1}50%{opacity:0.85}}
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.buy-btn{padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.buy-btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,0.3);transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s}
.buy-btn:hover::before{width:300px;height:300px}
.buy-btn:hover{background:var(--primary-hover);transform:translateY(-2px);box-shadow:0 8px 16px rgba(139,92,246,0.3)}
.buy-btn:active{transform:translateY(0);box-shadow:0 4px 8px rgba(139,92,246,0.3)}
.shop-item.premium .buy-btn{background:linear-gradient(135deg,var(--gold),#f59e0b)}
.shop-item.premium .buy-btn:hover{box-shadow:0 8px 16px rgba(251,191,36,0.4)}
.buy-btn:disabled{opacity:0.5;cursor:not-allowed}
.buy-btn:disabled:hover{transform:none;box-shadow:none}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
.loading-skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:1000px 100%;animation:shimmer 2s infinite linear;border-radius:8px}
.shop-item{animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) backwards}
.shop-item:nth-child(1){animation-delay:0.05s}
.shop-item:nth-child(2){animation-delay:0.1s}
.shop-item:nth-child(3){animation-delay:0.15s}
.shop-item:nth-child(4){animation-delay:0.2s}
.shop-item:nth-child(5){animation-delay:0.25s}
.shop-item:nth-child(6){animation-delay:0.3s}
.shop-item:nth-child(7){animation-delay:0.35s}
.shop-item:nth-child(8){animation-delay:0.4s}
.shop-item:nth-child(9){animation-delay:0.45s}
@media(max-width:968px){.sidebar{width:0;transform:translateX(-100%)}.main{margin-left:0}.topbar,.content{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo-icon">BC</div>
      <div class="logo-text">Bánh Cuốn</div>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Overview</div>
        <div class="nav-item" onclick="window.location.href='/dashboard.html'">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </div>
        <div class="nav-item" onclick="window.location.href='/quest.html'">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Quests
          <span class="badge">3/5</span>
        </div>
        <div class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          Shop
        </div>
        <div class="nav-item" onclick="window.location.href='/profile.html'">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Manage</div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><path d="M6 6h.01M6 18h.01"/></svg>
          Servers
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"/></svg>
          Settings
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Upgrade</div>
        <div class="nav-item" style="color:#f59e0b">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Premium
        </div>
      </div>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search-box">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Tìm items...">
      </div>
      <div class="topbar-right">
        <div class="balance-badge" id="balanceBadge">
          💰 <span id="balanceAmount">Loading...</span>
        </div>
        <div class="icon-btn">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <div class="dot"></div>
        </div>
        <div class="user-btn" onclick="window.location.href='/profile.html'">
          <span class="user-name" id="userName">User</span>
          <img class="user-avatar" id="userAvatar" src="" alt="">
        </div>
      </div>
    </div>
    <div class="content">
      <div class="page-header">
        <h1 class="page-title">Premium Shop</h1>
        <p class="page-subtitle">Mua items độc đáo với coin đã kiếm được</p>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active">Tất cả</button>
        <button class="filter-tab">Roles</button>
        <button class="filter-tab">Badges</button>
        <button class="filter-tab">Premium</button>
      </div>
      <div class="shop-grid" id="shopGrid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-3)">
          Đang tải shop...
        </div>
      </div>
    </div>
  </main>
</div>
<script>
if(!localStorage.getItem('discord_user'))window.location.href='/?login=required'
const user=JSON.parse(localStorage.getItem('discord_user'))
document.getElementById('userName').textContent=user.username
document.getElementById('userAvatar').src=user.avatar||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%238b5cf6"/></svg>'

// Load user balance
async function loadUserBalance(){
  try{
    const res=await fetch(`/api/user/${user.id}/coins`)
    if(!res.ok)throw new Error('Failed to fetch balance')
    const data=await res.json()
    
    const blueCoins=(data.blueCoins||0).toLocaleString()
    const goldCoins=(data.goldCoins||0).toLocaleString()
    
    if(data.goldCoins>0){
      document.getElementById('balanceAmount').innerHTML=`${blueCoins} 💙 | ${goldCoins} 💛`
    }else{
      document.getElementById('balanceAmount').textContent=`${blueCoins} coins`
    }
  }catch(e){
    console.error('Load balance error:',e)
    document.getElementById('balanceAmount').textContent='Error'
  }
}

// Load shop items from API
async function loadShopItems(){
  try{
    const res=await fetch('/api/shop/items')
    if(!res.ok)throw new Error('Failed to fetch')
    const items=await res.json()
    const grid=document.getElementById('shopGrid')
    
    if(!items||items.length===0){
      grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-3)">Không có items nào</div>'
      return
    }
    
    grid.innerHTML=items.map((item,i)=>{
      const isPremium=item.price>=150000
      const stockText=item.stock!==undefined?` (còn ${item.stock})`:''
      return`<div class="shop-item${isPremium?' premium':''}" style="animation-delay:${i*0.05}s">
        <div class="item-icon">${item.icon}</div>
        <div class="item-header">
          <div class="item-name">${item.name}${stockText}</div>
          <div class="item-badge">Role</div>
        </div>
        <div class="item-desc">${item.description}</div>
        <div class="item-footer">
          <div class="item-price">${(item.price/1000).toFixed(0)}K <span class="coin">💰</span></div>
          <button class="buy-btn" onclick="buyItem('${item.id}')" ${item.stock===0?'disabled':''}>
            ${item.stock===0?'Hết hàng':'Mua ngay'}
          </button>
        </div>
      </div>`
    }).join('')
  }catch(e){
    console.error('Load shop error:',e)
    document.getElementById('shopGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-3)">Lỗi khi tải shop</div>'
  }
}

function buyItem(itemId){
  alert('Tính năng mua item đang phát triển. Item ID: '+itemId)
}

loadUserBalance()
loadShopItems()
</script>
</body>
</html>
