<!DOCTYPE html>
<html>
<head>
  <title>Clear Session</title>
</head>
<body style="font-family: Arial; text-align: center; padding: 50px;">
  <h1>🧹 Clearing Session...</h1>
  <p id="status">Please wait...</p>
  
  <script>
    localStorage.clear();
    sessionStorage.clear();
    document.getElementById('status').innerHTML = '✅ Session cleared!<br><br><a href="/" style="padding: 10px 20px; background: #5865f2; color: white; text-decoration: none; border-radius: 5px;">Go to Dashboard</a>';
  </script>
</body>
</html>
